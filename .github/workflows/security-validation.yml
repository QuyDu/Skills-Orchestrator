name: Security validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use maintained Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - name: Validate locked dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run syntax, contracts, security fixtures, and verification
        run: npm run check
      - name: Record successful matrix evidence
        run: node scripts/ci-evidence.mjs record --os "${{ runner.os }}" --node "${{ matrix.node }}" --commit "${{ github.sha }}" --output "reports/ci-runs/${{ runner.os }}-${{ matrix.node }}.json"
      - name: Upload matrix evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ci-${{ runner.os }}-${{ matrix.node }}
          path: reports/ci-runs/*.json
          if-no-files-found: error
          retention-days: 30

  evidence:
    name: Aggregate cross-platform evidence
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use maintained Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          check-latest: true
      - name: Download matrix evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ci-*
          path: reports/ci-download
          merge-multiple: true
      - name: Aggregate evidence
        run: node scripts/ci-evidence.mjs aggregate --input reports/ci-download --output reports/cross-platform-ci-evidence.json --commit "${{ github.sha }}"
      - name: Upload release evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cross-platform-ci-evidence
          path: reports/cross-platform-ci-evidence.json
          if-no-files-found: error
          retention-days: 90